<style>
  .wrap { padding: var(--space-8); background: var(--surface-page); display: inline-flex; }
  .t-card { width: 240px; background: var(--surface-wash); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-4); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 6px; }
  .t-stars { display: flex; gap: 2px; color: var(--rating-gold); }
  .t-stars svg { width: 12px; height: 12px; }
  .t-quote { color: var(--ink); font-size: 13px; line-height: 18px; font-weight: 500; margin: 0; }
  .t-person { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .t-avatar { width: 22px; height: 22px; border-radius: 50%; background: linear-gradient(135deg, var(--avatar-gradient-start), var(--avatar-gradient-end)); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
  .t-name { color: var(--ink-dim); font-size: 12px; }
</style>
<div id="root">
  <div class="wrap">
    <div class="t-card">
      <div class="t-stars">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.6 7.1.7-5.4 4.8 1.6 7-6.2-3.7-6.2 3.7 1.6-7-5.4-4.8 7.1-.7z"/></svg>
      </div>
      <p class="t-quote">"Corso pratico, applicabile da subito in ambulatorio."</p>
      <div class="t-person">
        <div class="t-avatar">MR</div>
        <div class="t-name">M. Rossi, Fisioterapista</div>
      </div>
    </div>
  </div>
</div>
