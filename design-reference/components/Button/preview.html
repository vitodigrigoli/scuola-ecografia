<!-- @dsCard group="Azioni" height=200 -->
<style>
  .btn-row { display: flex; flex-wrap: wrap; gap: var(--space-8); align-items: center; padding: var(--space-8); background: var(--surface-page); }
  .btn { font-family: var(--font-sans); border: none; cursor: pointer; border-radius: var(--radius-btn); display: inline-flex; align-items: center; gap: var(--space-2); }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btn-primary { background: var(--cta-primary-bg); color: var(--cta-primary-ink); font-size: 18px; font-weight: 700; padding: var(--space-8) var(--space-12); }
  .login-link { font-family: var(--font-sans); color: var(--login-ink); font-size: 13.5px; font-weight: 500; border-radius: var(--radius-xs); padding: var(--space-2) 10px; text-decoration: none; }
  .toggle { display: inline-flex; background: var(--surface-card); border: 1px solid var(--border); border-radius: var(--radius-pill); padding: 4px; gap: 4px; }
  .toggle-btn { font-family: var(--font-sans); border: none; cursor: pointer; border-radius: var(--radius-pill); padding: 9px var(--space-6); font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; gap: 6px; }
  .toggle-btn.active { background: var(--cta-primary-bg); color: var(--cta-primary-ink); }
  .toggle-btn:not(.active) { background: transparent; color: var(--ink-inactive); }
  .tb-tag { background: var(--accent-wash); color: var(--accent); border-radius: var(--radius-pill); padding: 2px 8px; font-size: 11px; font-weight: 800; }
</style>
<div id="root">
  <div class="btn-row">
    <button class="btn btn-primary">Prenota il corso</button>
    <a class="login-link" href="#">Login</a>
    <div class="toggle">
      <button class="toggle-btn">Modulo singolo</button>
      <button class="toggle-btn active">Percorso completo <span class="tb-tag">−15%</span></button>
    </div>
  </div>
</div>
