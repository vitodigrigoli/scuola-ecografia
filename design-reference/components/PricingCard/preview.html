<!-- @dsCard group="Card" height=460 width=300 -->
<style>
  .wrap { padding: var(--space-8); background: var(--surface-page); display: inline-flex; gap: var(--space-6); }
  .p-card { width: 240px; border-radius: var(--radius-lg); padding: var(--space-10) var(--space-8); font-family: var(--font-sans); display: flex; flex-direction: column; gap: var(--space-2); }
  .p-standard { background: var(--surface-card-bordered); border: 1px solid var(--border); }
  .p-featured { background: transparent; border: 1px solid var(--accent-border); box-shadow: var(--shadow-accent-glow); }
  .p-badge { align-self: flex-start; display: inline-flex; align-items: center; gap: 6px; background: var(--accent); color: var(--on-accent); border-radius: var(--radius-pill); padding: 5px 14px; font-size: 11px; font-weight: 800; margin-bottom: 4px; }
  .p-badge svg { width: 12px; height: 12px; }
  .p-name { color: var(--ink-soft); font-size: 21px; font-weight: 900; margin: 0; }
  .p-price-row { display: flex; align-items: baseline; gap: 6px; margin-top: 4px; }
  .p-amt { color: var(--ink-soft); font-size: 42px; font-weight: 900; }
  .p-amt-sm { color: var(--ink-soft); font-size: 32px; font-weight: 900; }
  .p-per { color: var(--ink-dim); font-size: 14px; }
  .p-old { color: var(--ink-faint); font-size: 18px; text-decoration: line-through; }
  .p-features { list-style: none; margin: var(--space-3) 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .p-features li { font-size: 14px; color: var(--ink-soft); display: flex; align-items: flex-start; gap: 8px; }
  .p-features li svg { width: 14px; height: 14px; flex-shrink: 0; margin-top: 3px; color: var(--accent); }
  .p-cta { margin-top: var(--space-2); border: none; cursor: pointer; background: var(--cta-primary-bg); color: var(--cta-primary-ink); border-radius: var(--radius-btn); padding: 14px var(--space-6); font-size: 15px; font-weight: 700; }
</style>
<div id="root">
  <div class="wrap">
    <div class="p-card p-standard">
      <div class="p-name">Modulo singolo</div>
      <div class="p-price-row"><span class="p-amt-sm">€180</span></div>
      <ul class="p-features">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>Accesso a un modulo a scelta</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>Attestato di partecipazione</li>
      </ul>
      <button class="p-cta">Prenota</button>
    </div>
    <div class="p-card p-featured">
      <span class="p-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>Il più scelto</span>
      <div class="p-name">Percorso completo</div>
      <div class="p-price-row"><span class="p-amt">€850</span></div>
      <div class="p-price-row"><span class="p-old">€1.000</span></div>
      <ul class="p-features">
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>Tutti i moduli del programma</li>
        <li><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>Casi clinici e sessioni pratiche</li>
      </ul>
      <button class="p-cta">Prenota</button>
    </div>
  </div>
</div>
